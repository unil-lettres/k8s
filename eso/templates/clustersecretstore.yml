{{- if .Values.openbao.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.openbao.store_name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  {{- if .Values.openbao.namespaces }}
  conditions:
    - namespaces:
      {{- range .Values.openbao.namespaces }}
        - {{ . | quote }}
      {{- end }}
  {{- end }}
  provider:
    vault:
      server: {{ .Values.openbao.server | quote }}
      path: {{ .Values.openbao.kv_path | quote }}
      version: {{ .Values.openbao.kv_version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.openbao.auth_mount_path | quote }}
          role: {{ .Values.openbao.auth_role | quote }}
          serviceAccountRef:
            name: external-secrets
            namespace: {{ .Values.namespace }}
{{- end }}
